name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Stap 1: Code uit de repository ophalen
      - name: Checkout code
        uses: actions/checkout@v3

      # Stap 2: Kubernetes-configuratie instellen met de secret
      - name: Set up Kubernetes config
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          echo "${KUBE_CONFIG_DATA}" > kubeconfig
          export KUBECONFIG=kubeconfig

      # Stap 3: Resources deployen naar k3s
      - name: Deploy to k3s cluster
        run: |
          kubectl apply -f k3s/

      # Stap 4: Verifiëren van de deployment
      - name: Verify deployment
        run: |
          kubectl get pods
          kubectl get svc
