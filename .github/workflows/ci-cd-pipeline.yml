name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Stap 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Stap 2: Kubernetes configuratie instellen
      - name: Set up Kubernetes config
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          echo "${KUBE_CONFIG_DATA}" > kubeconfig
          export KUBECONFIG=kubeconfig

      # Stap 3: Verwijder bestaande resources
      - name: Delete existing resources
        run: |
          kubectl delete -f k3s/ --ignore-not-found
          echo "Existing resources deleted"

      # Stap 4: Controleer of resources zijn verwijderd
      - name: Verify deletion
        run: |
          kubectl get all || echo "No resources remaining"

      # Stap 5: Deploy nieuwe resources
      - name: Deploy new resources
        run: |
          kubectl apply -f k3s/
          echo "New resources deployed"

      # Stap 6: Controleer de status
      - name: Verify deployment
        run: |
          kubectl get pods
          kubectl get svc
