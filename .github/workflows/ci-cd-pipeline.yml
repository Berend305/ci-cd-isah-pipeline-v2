name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Stap 1: Checkout de code
      - name: Checkout code
        uses: actions/checkout@v3

      # Stap 2: Stel de Kubernetes-configuratie in
      - name: Set up Kubernetes config
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p $HOME/.kube # Zorg ervoor dat de .kube map bestaat
          echo "${KUBE_CONFIG_DATA}" > $HOME/.kube/config
          export KUBECONFIG=$HOME/.kube/config

      # Debug stap 1: Controleer of de kubeconfig correct is ingesteld
      - name: Debug kubeconfig
        run: |
          echo "KUBECONFIG is set to $KUBECONFIG"
          cat $HOME/.kube/config

      # Debug stap 2: Controleer of de Kubernetes API toegankelijk is
      - name: Test API accessibility
        run: |
          curl -k https://192.168.151.245:6443

      # Stap 3: Verwijder bestaande resources
      - name: Delete existing resources
        run: |
          kubectl delete -f k3s/ --ignore-not-found
          echo "Existing resources deleted"

      # Stap 4: Controleer of de resources zijn verwijderd
      - name: Verify deletion
        run: |
          kubectl get all || echo "No resources remaining"

      # Stap 5: Deploy nieuwe resources
      - name: Deploy new resources
        run: |
          kubectl apply -f k3s/
          echo "New resources deployed"

      # Stap 6: Controleer de status van de deployment
      - name: Verify deployment
        run: |
          kubectl get pods
          kubectl get svc
